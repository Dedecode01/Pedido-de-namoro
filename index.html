<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100919">
  <title>Uma pergunta para você meu nenezinho ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="stars" aria-hidden="true"></div>
    <img class="art" src="https://wiki.leagueoflegends.com/en-us/images/Soraka_NightbringerSkin.jpg?748f6" alt="Soraka Nightbringer sob um céu cósmico">
    <div class="veil" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="transition-wash" id="transition-wash" aria-hidden="true"></div>
    <div class="falling-stars" id="falling-stars" aria-hidden="true"></div>

    <section class="content" aria-labelledby="question">
      <p class="eyebrow">Uma pergunta escrita nas estrelas</p>
      <h1 id="question">Quer ter uma<span>Vida inteira comigo ao meu lado ?</span></h1>
      <p class="intro" id="intro">Entre todas as estrelas desse universo, é você quem eu escolheria encontrar. Aceita namorar comigo minha nenezinha ? </p>
      <div class="actions" id="actions">
        <button class="yes" id="yes" type="button"><span aria-hidden="true">✦</span> Sim, eu aceito Dedé</button>
        <button class="no" id="no" type="button">Não quero dedé </button>
      </div>
      <p class="hint" id="hint" aria-live="polite">Escolha com o coração se não te mato de amor</p>
    <div class="toast" id="toast" role="status" aria-live="polite">Meu amor você vai ficar comigo siiim  ❤️</div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
